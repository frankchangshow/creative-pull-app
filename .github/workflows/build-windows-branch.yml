name: Build Windows App (Branch)

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      shell: pwsh
      run: |
        pyinstaller --noconfirm --clean --log-level DEBUG --onedir --windowed --name "CreativePullApp" `
          --paths . `
          --hidden-import tkinter `
          --hidden-import "ui.preview" `
          --hidden-import "ui.settings" `
          --hidden-import "ui.advanced" `
          --hidden-import "utils.markup_parser" `
          --runtime-hook pyinstaller_hooks/rthook_add_local_packages.py `
          --add-data "ui;ui" `
          --add-data "utils;utils" `
          --add-data "clients;clients" `
          --add-data "services;services" `
          --add-data "config;config" `
          --collect-all databricks `
          --collect-all thrift `
          --collect-all pandas `
          --add-data "databricks_job_templates;databricks_job_templates" `
          --add-data "savanna_bearer_client.py;." `
          creative_previewer_app_webview.py

        # Console build for debugging (prints stdout/stderr)
        pyinstaller --noconfirm --clean --log-level DEBUG --onedir --console --name "CreativePullApp_console" `
          --paths . `
          --hidden-import tkinter `
          --hidden-import "ui.preview" `
          --hidden-import "ui.settings" `
          --hidden-import "ui.advanced" `
          --hidden-import "utils.markup_parser" `
          --runtime-hook pyinstaller_hooks/rthook_add_local_packages.py `
          --add-data "ui;ui" `
          --add-data "utils;utils" `
          --add-data "clients;clients" `
          --add-data "services;services" `
          --add-data "config;config" `
          --collect-all databricks `
          --collect-all thrift `
          --collect-all pandas `
          --add-data "databricks_job_templates;databricks_job_templates" `
          --add-data "savanna_bearer_client.py;." `
          creative_previewer_app_webview.py

    - name: Show dist size
      shell: pwsh
      run: |
        Get-ChildItem -Recurse dist/CreativePullApp | Measure-Object -Property Length -Sum | ForEach-Object { "Dist (windowed) size: {0:N0} bytes" -f $_.Sum }
        Get-ChildItem -Recurse dist/CreativePullApp_console | Measure-Object -Property Length -Sum | ForEach-Object { "Dist (console) size: {0:N0} bytes" -f $_.Sum }

    - id: sanitize
      name: Sanitize ref name
      shell: pwsh
      run: |
        $branch='${{ github.ref_name }}'
        $safe=$branch -replace '[\\/:\*\?"<>\| ]','-'
        echo "SAFE_REF=$safe" >> $env:GITHUB_OUTPUT

    - name: Package application
      shell: pwsh
      run: |
        $safe='${{ steps.sanitize.outputs.SAFE_REF }}'
        Compress-Archive -Path dist/CreativePullApp -DestinationPath ("CreativePullApp_Windows_{0}.zip" -f $safe)
        Compress-Archive -Path dist/CreativePullApp_console -DestinationPath ("CreativePullApp_Windows_console_{0}.zip" -f $safe)

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CreativePullApp_Windows_${{ steps.sanitize.outputs.SAFE_REF }}
        path: |
          CreativePullApp_Windows_${{ steps.sanitize.outputs.SAFE_REF }}.zip
          CreativePullApp_Windows_console_${{ steps.sanitize.outputs.SAFE_REF }}.zip
        if-no-files-found: error
