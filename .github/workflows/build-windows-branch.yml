name: Build Windows App (Branch)

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      shell: pwsh
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "CreativePullApp" `
          --hidden-import tkinter `
          --add-data "clients;clients" `
          --add-data "config;config" `
          --add-data "databricks_job_templates;databricks_job_templates" `
          --add-data "services;services" `
          --add-data "ui;ui" `
          --add-data "utils;utils" `
          --add-data "savanna_bearer_client.py;." `
          creative_previewer_app_webview.py

    - name: Package application
      shell: pwsh
      run: |
        Compress-Archive -Path dist/CreativePullApp -DestinationPath CreativePullApp_Windows_${{ github.ref_name }}.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CreativePullApp_Windows_${{ github.ref_name }}
        path: CreativePullApp_Windows_${{ github.ref_name }}.zip
        if-no-files-found: error
