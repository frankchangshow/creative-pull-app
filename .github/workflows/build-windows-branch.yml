name: Build Windows App (Branch)

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      shell: pwsh
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "CreativePullApp" `
          --hidden-import tkinter `
          --add-data "clients;clients" `
          --add-data "config;config" `
          --add-data "databricks_job_templates;databricks_job_templates" `
          --add-data "services;services" `
          --add-data "ui;ui" `
          --add-data "utils;utils" `
          --add-data "savanna_bearer_client.py;." `
          creative_previewer_app_webview.py

    - id: sanitize
      name: Sanitize ref name
      shell: pwsh
      run: |
        $branch='${{ github.ref_name }}'
        $safe=$branch -replace '[\\/:\*\?"<>\| ]','-'
        echo "SAFE_REF=$safe" >> $env:GITHUB_OUTPUT

    - name: Package application
      shell: pwsh
      run: |
        $safe='${{ steps.sanitize.outputs.SAFE_REF }}'
        Compress-Archive -Path dist/CreativePullApp -DestinationPath ("CreativePullApp_Windows_{0}.zip" -f $safe)

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CreativePullApp_Windows_${{ steps.sanitize.outputs.SAFE_REF }}
        path: CreativePullApp_Windows_${{ steps.sanitize.outputs.SAFE_REF }}.zip
        if-no-files-found: error
